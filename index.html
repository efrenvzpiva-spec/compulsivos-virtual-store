<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; min-height: 100vh; }
    .container { max-width: 1400px; margin: 0 auto; }
    .header { text-align: center; background: white; padding: 30px; border-radius: 20px; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .logo { font-size: 2.5em; font-weight: bold; background: linear-gradient(45deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; color: transparent; margin-bottom: 10px; }
    .subtitle { color: #666; font-size: 1.2em; }
    .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; margin-bottom: 100px; }
    .product { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.1); transition: transform 0.3s; }
    .product:hover { transform: translateY(-10px); box-shadow: 0 15px 40px rgba(0,0,0,0.2); }
    .product img { width: 100%; height: 250px; object-fit: cover; }
    .product-info { padding: 15px; }
    .product-name { font-weight: bold; margin-bottom: 10px; color: #333; font-size: 0.9em; }
    .add-btn { width: 100%; padding: 12px; background: linear-gradient(45deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1em; transition: opacity 0.3s; }
    .add-btn:hover { opacity: 0.8; }
    .cart { position: fixed; bottom: 20px; right: 20px; background: #25d366; color: white; padding: 20px; border-radius: 50%; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 2em; box-shadow: 0 10px 30px rgba(0,0,0,0.3); cursor: pointer; transition: transform 0.3s; }
    .cart:hover { transform: scale(1.1); }
    .cart-count { position: absolute; top: -5px; right: -5px; background: red; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 0.6em; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">

  </div>

ttps://wa.me/${whatsapp}?text=${msg}`,'_blank');}
  </script>
</body>
</html>
