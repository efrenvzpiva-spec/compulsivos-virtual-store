<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compulsivos Virtual Store - Tu Mundo en un Clic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; background: white; padding: 30px; border-radius: 20px; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .logo { font-size: 2.5em; font-weight: bold; background: linear-gradient(45deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; color: transparent; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 1.2em; }
        .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; margin-bottom: 100px; }
        .product { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.1); transition: transform 0.3s; }
        .product:hover { transform: translateY(-10px); box-shadow: 0 15px 40px rgba(0,0,0,0.2); }
        .product img { width: 100%; height: 250px; object-fit: cover; }
        .product-info { padding: 15px; }
        .product-name { font-weight: bold; margin-bottom: 10px; color: #333; font-size: 0.9em; }
        .add-btn { width: 100%; padding: 12px; background: linear-gradient(45deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1em; transition: opacity 0.3s; }
        .add-btn:hover { opacity: 0.9; }
        .cart { position: fixed; bottom: 20px; right: 20px; background: #2d3561; color: white; padding: 20px; border-radius: 50%; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 0.8em; font-weight: bold; cursor: pointer; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .cart:hover { transform: scale(1.1); }
        .cart-count { position: absolute; top: -5px; right: -5px; background: red; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 0.8em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="logo">Compulsivos Virtual Store</h1>
            <p class="subtitle">Tu Mundo en un Clic</p>
        </div>
        <div id="products" class="products"></div>
    </div>
    <div class="cart" onclick="sendToWhatsApp()">🛒
        <div class="cart-count" id="cart-count">0</div>
    </div>
    <script>
        const whatsapp='584245317606';
        const products=[
{n:'Smartwatch D20',i:'images/1000011032.jpg'},
{n:'Afeitadora Philips',i:'images/1000011034.jpg'},
{n:'Creatina Muscletech',i:'images/1000011036.jpg'},
{n:'Soporte Celular',i:'images/1000011039.jpg'},
{n:'Bombillo LED',i:'images/1000011040.jpg'},
{n:'Smartwatch FDG8',i:'images/1000011041.jpg'},
{n:'Llavero LED',i:'images/1000011042.jpg'},
{n:'Control Bluetooth',i:'images/1000011048.jpg'},
{n:'Router TP-Link',i:'images/1000011051.jpg'},
{n:'Mousepad RGB',i:'images/1000011054.jpg'},
{n:'Auxiliares LED',i:'images/1000011057.jpg'},
{n:'Bombillos LED LUPA',i:'images/1000011060.jpg'},
{n:'Proyector 220W',i:'images/1000011064.jpg'},
{n:'Bombillos LED CSP',i:'images/1000011065.jpg'},
{n:'Adaptador Bluetooth',i:'images/1000011066.jpg'},
{n:'Teclado Gaming',i:'images/1000011068.jpg'},
{n:'Mouse Gamer',i:'images/1000011070.jpg'},
{n:'Auriculares',i:'images/1000011072.jpg'},
{n:'Smartwatch T800',i:'images/1000011073.jpg'},
{n:'Cinta LED RGB',i:'images/1000011076.jpg'},
{n:'Router WiFi',i:'images/1000011080.jpg'},
{n:'Parlante Bluetooth',i:'images/1000011083.jpg'},
{n:'Mini Dremel',i:'images/1000011089.jpg'},
{n:'Base Celular',i:'images/1000011095.jpg'},
{n:'Adaptador Bluetooth 2 en 1',i:'images/1000011096.jpg'},
{n:'Proteína Muscletech',i:'images/1000011098.jpg'},
{n:'Consola Stick X2',i:'images/1000011099.jpg'},
{n:'Consola X6',i:'images/1000011102.jpg'},
{n:'Afeitadora Philips All in One',i:'images/1000011103.jpg'},
{n:'Proyector HD',i:'images/1000011105.jpg'}
];
let cart=[];function renderProducts(){const container=document.getElementById('products');products.forEach((p,i)=>{const div=document.createElement('div');div.className='product';div.innerHTML=`<img src="${p.i}" alt="${p.n}"><div class="product-info"><div class="product-name">${p.n}</div><button class="add-btn" onclick="addToCart(${i})">Agregar al Carrito</button></div>`;container.appendChild(div);});}function addToCart(i){cart.push(products[i].n);updateCart();}function updateCart(){document.getElementById('cart-count').textContent=cart.length;}function sendToWhatsApp(){if(cart.length===0){alert('El carrito está vacío');return;}let msg='🛍 *Compulsivos Virtual Store*\n\n*Pedido:*\n';cart.forEach((item,i)=>msg+=`${i+1}. ${item}\n`);msg+='\n¡Gracias!';window.open(`https://api.whatsapp.com/send?phone=${whatsapp}&text=${encodeURIComponent(msg)}`);}renderProducts();
    </script>
</body>
</html>
